    function searchGuest() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (!q) return;

      const filtered = guests.filter(g => 
        (g.name && g.name.toLowerCase().includes(q)) || 
        (g.nick && g.nick.toLowerCase().includes(q))
      );

      if (filtered.length === 0) {
        resultsDiv.innerHTML = '<p style="color: #999; margin: 15px 0;">ไม่พบรายชื่อ กรุณาติดต่อโต๊ะลงทะเบียนหน้างาน</p>';
        return;
      }

      filtered.forEach(g => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="guest-name">${g.name} ${g.nick ? `(${g.nick})` : ''}</div>
          <div class="seat-info">ที่นั่ง: <span class="highlight-table">${g.table}</span> • ${g.zone}</div>
        `;
        resultsDiv.appendChild(item);
      });
    }
  </script>
